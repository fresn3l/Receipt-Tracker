[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-app"
version = "0.1.0"
description = "Unified macOS Finance App — banking CSV tracker + grocery receipt tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "python-multipart>=0.0.12",
  "openai>=1.55.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.6.0",
  "pillow>=11.0.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "click>=8.1.0",
  "pyyaml>=6.0",
  "pywebview>=5.0",
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0", "pyinstaller>=6.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
finance-app = "app.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["banking*", "receipts*", "app*"]

[tool.setuptools.package-dir]
banking = "packages/banking"
receipts = "packages/receipts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
